<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Unbounded:wght@700&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Manrope,sans-serif;color:#e8f5ee;position:relative;
    background:radial-gradient(70% 90% at 100% 0%,#3fdb9840,transparent 60%),radial-gradient(60% 70% at 0% 100%,#7c6bff3a,transparent 60%),linear-gradient(160deg,#0b241b,#07120e)}
  .pattern{position:absolute;inset:0;opacity:.09}
  .text{position:absolute;left:80px;top:96px;width:640px}
  .logo{display:flex;align-items:center;gap:16px;font:700 34px Unbounded}
  .mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(140deg,#3fdb98,#17634b)}
  h1{font:700 76px/1.05 Unbounded;margin:48px 0 24px;letter-spacing:-.02em}
  h1 span{color:#c8f169}
  p{font-size:30px;font-weight:700;color:#b9cfc3;margin:0}
  .chips{display:flex;gap:12px;margin-top:36px}
  .chip{padding:10px 20px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff24;font-size:22px;font-weight:800}
  .art{position:absolute;right:70px;top:110px;width:400px}
</style>
</head>

<div class="text">

  <h1>Химия без зубрёжки. <span>Погнали?</span></h1>

</div>

  <circle cx="120" cy="128" r="96" fill="#0f3324"/>
  <g><ellipse cx="184" cy="56" rx="34" ry="13" fill="none" stroke="#b0a3ff" stroke-width="3"/><ellipse cx="184" cy="56" rx="34" ry="13" transform="rotate(60 184 56)" fill="none" stroke="#b0a3ff" stroke-width="3"/><circle cx="184" cy="56" r="6" fill="#b0a3ff"/></g>

  <circle cx="104" cy="170" r="7" fill="#0f1f19" opacity=".8"/><circle cx="132" cy="160" r="5" fill="#0f1f19" opacity=".8"/><circle cx="120" cy="182" r="4" fill="#0f1f19" opacity=".8"/>
